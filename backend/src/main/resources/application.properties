spring.application.name=expense-manager

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:wallace_dev}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Base currency used for exchange rates
expense.currency.base-code=MYR

# Redis connection
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Refresh cached currency rates from MySQL every day at noon in Malaysia
expense.currency.cache-refresh-cron=0 0 12 * * *
expense.currency.cache-refresh-zone=Asia/Kuala_Lumpur

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.zaxxer.hikari=DEBUG
